# Pipeline de integración continua de CitasYA.
#
# Implementa la Definición de Terminado (DoD) del trabajo de grado como
# "quality gates" automáticos. Un PR solo puede integrarse a main si todos
# los jobs terminan en verde (protección de rama):
#
#   build          → build de producción (insumo de accesibilidad y lighthouse)
#   calidad        → tipos, lint (incluye jsx-a11y), pruebas unitarias
#   seguridad      → npm audit de dependencias de producción (alta/crítica)
#   accesibilidad  → axe-core en navegador real, perfiles móvil y escritorio
#   lighthouse     → Lighthouse CI (mediana de 3 corridas), móvil y escritorio
#   interoperabilidad → casos TC-01 a TC-10 (IND-10) contra HAPI FHIR R4 en un
#                    contenedor de servicio con versión fijada (ADR-0009)
#
# Los gates son independientes: cada uno reporta su propio resultado aunque
# otro falle, para que cada ejecución sea una medición completa.
# Los umbrales viven en lighthouserc.cjs y e2e/accesibilidad.spec.ts.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24 # misma versión mayor que el entorno de build de Vercel

jobs:
  build:
    name: Build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  calidad:
    name: Calidad (tipos, lint, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # !cancelled(): los tres pasos se ejecutan aunque uno falle, para
      # reportar todos los problemas en una sola ejecución.
      - name: Verificación de tipos (TypeScript estricto)
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Lint (ESLint + jsx-a11y strict)
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Pruebas unitarias con cobertura
        if: ${{ !cancelled() }}
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cobertura
          path: coverage
          retention-days: 30

  seguridad:
    name: Seguridad (dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit de producción (bloqueante; alta o crítica)
        run: npm run audit:deps
      - name: npm audit completo, incluye herramientas de desarrollo (informativo)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

  accesibilidad:
    name: Accesibilidad WCAG 2.1 AA (axe-core)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: axe-core en móvil y escritorio
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reporte-accesibilidad
          path: playwright-report
          retention-days: 30

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        perfil: [movil, escritorio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Lighthouse CI ${{ matrix.perfil }} (3 corridas por URL, se evalúa la mediana)
        run: npm run lhci
        env:
          LHCI_PROFILE: ${{ matrix.perfil }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-${{ matrix.perfil }}
          path: .lighthouseci
          include-hidden-files: true # .lighthouseci es un directorio oculto
          retention-days: 30

  interoperabilidad:
    name: Interoperabilidad FHIR (HAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HAPI FHIR R4 con versión fijada y base en memoria: cada ejecución parte de
    # cero y no depende de la disponibilidad del servidor público de pruebas.
    services:
      hapi:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # La imagen no trae shell para un healthcheck: se espera a que responda /metadata.
      - name: Esperar a que HAPI FHIR responda
        run: |
          for intento in $(seq 1 60); do
            if curl -sf -H 'Accept: application/fhir+json' http://localhost:8080/fhir/metadata > /dev/null; then
              echo "HAPI FHIR listo tras ${intento} intento(s)"
              exit 0
            fi
            sleep 5
          done
          echo "HAPI FHIR no respondió en 5 minutos" >&2
          exit 1
      - name: Casos TC-01 a TC-10 (IND-10)
        run: npm run test:fhir
        env:
          FHIR_BASE_URL: http://localhost:8080/fhir
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: interoperabilidad-fhir
          path: fhir/reportes
          retention-days: 30
