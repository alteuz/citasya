# HAPI FHIR R4: ambiente de respaldo y de demostración (ADR-0009, sección 4.4.6).
#
#   docker compose up -d                                  → http://localhost:8080/fhir
#   FHIR_BASE_URL=http://localhost:8080/fhir npm run test:fhir
#
# - La imagen va fijada a una versión, no a «latest», para que las pruebas sean reproducibles.
# - PostgreSQL con volumen: los datos sobreviven a los reinicios (en CI, HAPI usa su base en memoria).
# - Solo escucha en localhost y no lleva datos personales: HAPI no trae autenticación.
# - La imagen de HAPI no incluye shell, así que no hay healthcheck; `npm run test:fhir`
#   y el job de CI esperan a que responda /fhir/metadata.
services:
  hapi:
    image: hapiproject/hapi:v8.12.0-2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      spring.datasource.url: jdbc:postgresql://hapi-db:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: ${HAPI_DB_PASSWORD:-solo-local}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    depends_on:
      hapi-db:
        condition: service_healthy
    restart: unless-stopped

  hapi-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:-solo-local}
    volumes:
      - hapi-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  hapi-datos:
